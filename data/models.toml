# -- Bluetooth advertised-name prefixes --------------------------------------
#
# Printers advertise a firmware serial name, not a marketing name — an E11
# shows up as `T0182A2507162197`, a T50M Pro as `T0117A...`. The vendor app
# resolves these with a startsWith() over per-model prefix tables
# (DeviceConstants.java + the communication/device/*Device.java classes);
# these entries are transcribed from there, with the marketing names kept as
# prefixes too so an IEEE 1284 MDL string ("T50M Pro") resolves the same way.
#
# Matching is case-insensitive and longest-prefix-first. The brand words
# "supvan" and "katasymbol" are additionally accepted anywhere in a name for
# discovery, but don't select a family.
#
# Caveat: E10/E11/E12/E16/T10/T16 are grouped under supvan_t50 for media and
# DPI, but the vendor drives them with different print flows (E11/E12 use the
# G15 flow over BLE). Discovery and naming are right; printing is unverified.

[[bt_names]]
model = "T50A"
family = "supvan_t50"
prefixes = ["t50a", "t0013a", "t0020a", "t0121a"]

[[bt_names]]
model = "T50M"
family = "supvan_t50"
prefixes = ["t50m", "t0021a", "t0022a", "t0104a"]

[[bt_names]]
model = "T50M Plus"
family = "supvan_t50"
prefixes = ["t0021b", "t0102b", "t0103b", "t0116b"]

