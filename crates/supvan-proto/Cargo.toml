[package]
name = "supvan-proto"
version.workspace = true
edition.workspace = true

[dependencies]
log.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync"] }
liblzma = "0.4"
# Raw LZMA1EXT encoder: the firmware needs streams without an end marker.
liblzma-sys = "0.4"
libc = "0.2"
uuid = "1"
# BLE GATT transport (E11/E12-class printers). Off by default — pulls a
# platform GATT client and its build deps. Enable with `--features ble`.
futures-util = { version = "0.3", optional = true }

# BlueZ over D-Bus (Linux) versus CoreBluetooth (macOS) are separate stacks, so
# each client is only a dependency on the platform where its backend compiles.
[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", optional = true, features = ["bluetoothd"] }

[target.'cfg(target_os = "macos")'.dependencies]
btleplug = { version = "0.13", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = []
ble = ["dep:bluer", "dep:btleplug", "dep:futures-util"]
