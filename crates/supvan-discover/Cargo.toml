[package]
name = "supvan-discover"
version.workspace = true
edition.workspace = true

[dependencies]
supvan-proto = { workspace = true }
log = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = "1"
dbus = "0.9"
tokio = { workspace = true, features = ["time", "rt", "macros"] }
futures-util = { version = "0.3", optional = true }

# BLE GATT discovery (LE scan). Off by default — pulls BlueZ build deps.
[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", optional = true, features = ["bluetoothd"] }

# macOS has no BlueZ; CoreBluetooth is reached through btleplug instead.
[target.'cfg(target_os = "macos")'.dependencies]
btleplug = { version = "0.13", optional = true }

[features]
default = []
ble = [
    "dep:bluer",
    "dep:btleplug",
    "dep:futures-util",
    "supvan-proto/ble",
]
